name: 功能建议 / Feature request
description: 描述使用场景与希望改善的体验 / Suggest an improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / Use case
      description: 你正在做什么，现有行为哪里不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进 / Proposed behavior
      description: 可附简图或示例；请考虑常驻桌面时的 CPU 与内存开销。
    validations:
      required: true
