name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare verified toolchain
        shell: pwsh
        run: ./setup-tools.ps1
      - name: Build native application
        shell: cmd
        run: call build-native.cmd
      - name: Package portable application
        shell: pwsh
        run: ./package-portable.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CoreTrace-windows-x64
          path: |
            dist/CoreTrace-windows-x64.zip
            dist/CoreTrace-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
